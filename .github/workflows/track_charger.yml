name: GLIDA Charger Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Single Instance Tracker
        run: |
          python tracker.py

      - name: Commit and Push Updated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add glida_charging_data.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update charging station data [skip ci]" && git push)
